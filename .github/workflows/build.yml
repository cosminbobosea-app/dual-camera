name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Acordare permisiuni Gradle
        run: chmod +x gradlew || true

      - name: Generare Gradle Wrapper stabil
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin || true

      - name: Compilare APK Release/Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Salvare APK ca artefact
        uses: actions/upload-artifact@v4
        with:
          name: DualPolaroidCamera-APK
          path: app/build/outputs/apk/debug/app-debug.apk
